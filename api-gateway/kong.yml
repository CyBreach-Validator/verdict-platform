_format_version: "3.0"

services:
  - name: backend-service
    url: http://host.docker.internal:8033

    plugins:
      - name: rate-limiting
        config:
          minute: 50
          policy: local
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: false

    routes:
      - name: root-route
        paths:
          - /
        methods:
          - GET

      - name: health-route
        paths:
          - /health
        strip_path: false

      - name: auth-route
        paths:
          - /auth
        strip_path: false

      - name: users-route
        paths:
          - /users
        strip_path: false

      - name: rules-route
        paths:
          - /rules
        strip_path: false

      - name: verdicts-route
        paths:
          - /verdicts
        strip_path: false

      - name: audit-logs-route
        paths:
          - /audit-logs
        strip_path: false

      - name: dashboard-route
        paths:
          - /dashboard
        strip_path: false

      - name: connectors-route
        paths:
          - /connectors
        strip_path: false
      
      - name: validator-route
        paths:
          - /validator
        strip_path: false
        methods:
          - POST