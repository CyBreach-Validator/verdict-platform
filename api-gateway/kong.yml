_format_version: "3.0"

services:
  - name: backend-service
    # N-D1: this was `host.docker.internal:8004`, which the port registry
    # assigns to **Beta's** `vp_app` -- so the Delta gateway proxied to another
    # pod's service and every request through it returned that pod's responses.
    # Delta's backend is on 8000 (`port-registery.md`), which is also what the
    # dashboard's `VITE_API_BASE_URL` default targets, so the direct path and the
    # gateway path now agree on one port.
    url: http://host.docker.internal:8000

    plugins:
      - name: rate-limiting
        config:
          minute: 50
          policy: local
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: false

    routes:
      - name: root-route
        paths:
          - /
        methods:
          - GET

      - name: health-route
        paths:
          - /health
        strip_path: false

      - name: api-v2-route
        paths:
          - /api/v2
        strip_path: false
