_format_version: "3.0"

services:
  - name: backend-service
    url: http://host.docker.internal:8004

    plugins:
      - name: rate-limiting
        config:
          minute: 50
          policy: local
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: false

    routes:
      - name: root-route
        paths:
          - /
        methods:
          - GET

      - name: health-route
        paths:
          - /health
        strip_path: false

      - name: api-v2-route
        paths:
          - /api/v2
        strip_path: false
